<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Kehadiran Mahasiswa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Dashboard Kehadiran</h1>

        <div class="tables-grid">
            <!-- Table Tidak Hadir (LEFT) -->
            <div class="table-wrapper not-hadir-theme">
                <div class="table-header">
                    <h2>Daftar Mahasiswa Tidak Hadir</h2>
                    <span class="status-badge">Absen</span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>NIM</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="notHadir : ${notHadirList}">
                            <td th:text="${notHadir.nama}"></td>
                            <td th:text="${notHadir.nim}"></td>
                            <td>
                                <span class="status-text" th:text="${notHadir.status ? 'Hadir' : 'Tidak Hadir'}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Table Hadir (RIGHT) -->
            <div class="table-wrapper hadir-theme">
                <div class="table-header">
                    <h2>Daftar Mahasiswa Hadir</h2>
                    <span class="status-badge">Tersedia</span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>NIM</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="hadir : ${hadirList}">
                            <td th:text="${hadir.nama}"></td>
                            <td th:text="${hadir.nim}"></td>
                            <td>
                                <span class="status-text" th:text="${hadir.status ? 'Hadir' : 'Tidak Hadir'}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
